[package]
name = "fanhuaji-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# shortcut: tracks the PR #74 branch of the Tauri repo; switch to `branch = "main"` once it merges.
# To work on core locally, add to .cargo/config.toml (not committed):
#   [patch."https://github.com/fanhuaji-desktop/fanhuaji-tauri"]
#   fanhuaji-core = { path = "../fanhuaji-tauri/src-tauri/core" }
fanhuaji-core = { git = "https://github.com/fanhuaji-desktop/fanhuaji-tauri", branch = "refactor/extract-core" }
# gpui-pre: Zed gpui snapshots that gpui-component tracks (crates.io `gpui` stopped at 0.2.2).
# Pinned exactly because gpui-component pins them too.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# runtime_shaders: compiles Metal shaders at launch, so building does not need full Xcode.
# font-kit: without it the macOS backend has no text system and renders no text at all.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders", "font-kit"] }
gpui-component = "=0.9.1"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
sys-locale = "0.3.2"
gpui-kit-assets = "=0.9.1"
